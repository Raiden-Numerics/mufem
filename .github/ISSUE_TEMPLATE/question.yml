name: ❓ Question / support
description: Ask a question or request help using mufem.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Before asking, please check the
        [documentation](https://raiden-numerics.github.io/mufem-doc/index.html)
        and existing issues.

        ⚠️ Issues are **public**. Please do not include confidential, proprietary,
        or personal data. Information you submit may be used to improve mufem.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant script, case, or output. Keep it minimal.
      render: python
  - type: input
    id: version
    attributes:
      label: mufem version
      placeholder: e.g. 0.4.1
