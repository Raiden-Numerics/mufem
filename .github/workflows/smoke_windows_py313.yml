name: Smoke (Windows x86-64, Python 3.13)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Windows smoke test on a GitHub-hosted windows-latest runner (free for this
# public repo). Installs the published Windows wheel from PyPI and runs the
# `moderate` validation tier — real solves on actual Windows (stronger than the
# Wine import check in mufem-dev CI).
#
# The Windows wheel is a single self-contained package (engine linked statically
# into mufem.pyd; no separate libmufem) and is published as alpha, so it installs
# only with --pre. Cases are launched serially with plain `python` (pymufem is
# only the Linux MPI launcher), so we --exclude-tag long/eternal (those tiers run
# for hours single-threaded here) and `mumps` (direct-solver cases). gmsh is
# still installed for any moderate case that builds its mesh at runtime.
jobs:
  smoke:
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install mufem (alpha Windows wheel)
        env:
          CI: '1'
          PIP_IS_CI: '1'
        run: |
          pip install --pre --force-reinstall --no-cache-dir mufem
          pip install -r requirements.txt  # matplotlib/numpy/gmsh: no longer mufem deps

      # ===== TEMPORARY DEBUG: reproduce case.py's EXACT mesh_path. Loading via a
      # forward-slash repo-root-relative path works for all meshes, but case.py
      # runs from the case dir and passes f"{dir_path}/geometry.mesh" where
      # dir_path = Path(__file__).resolve().parent (backslash absolute, mixed
      # separator on Windows). Team1b/Team7 fail there; Team13 (same pattern)
      # passes. Test path-format variants per case to isolate the trigger. =====
      - name: DEBUG - mesh_path format variants (from each case dir)
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import os, mufem
          from pathlib import Path
          print("mufem", getattr(mufem, "__version__", "?"))
          root = os.getcwd()
          cases = {
              "Team1b(FAIL)": "Electromagnetics/Compumag-Team1b-Felix-Cylinder",
              "Team7(FAIL)":  "Electromagnetics/Compumag-Team7-Asymmetrical-Conductor-with-a-Hole",
              "Team13(pass)": "Electromagnetics/Compumag-Team13-3-D-Non-Linear-Magnetostatic-Model",
          }
          for tag, d in cases.items():
              os.chdir(os.path.join(root, d))
              dir_path = Path("case.py").resolve().parent  # == Path(__file__).resolve().parent
              variants = {
                  "case.py f-string": f"{dir_path}/geometry.mesh",
                  "native str":       str(dir_path / "geometry.mesh"),
                  "as_posix":         (dir_path / "geometry.mesh").as_posix(),
                  "relative":         "geometry.mesh",
              }
              print(f"=== {tag}  cwd={os.getcwd()} ===")
              for name, p in variants.items():
                  try:
                      mufem.Simulation.New(name=tag, mesh_path=p)
                      print(f"  OK    {name:16} -> {p}")
                  except Exception as e:
                      print(f"  FAIL  {name:16} -> {p} : {e}")
              os.chdir(root)
          PY
