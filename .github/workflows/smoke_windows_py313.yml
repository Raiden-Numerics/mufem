name: Smoke (Windows x86-64, Python 3.13)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Windows smoke test on a GitHub-hosted windows-latest runner (free for this
# public repo). Installs the published Windows wheel from PyPI and runs the
# `moderate` validation tier — real solves on actual Windows (stronger than the
# Wine import check in mufem-dev CI).
#
# The Windows wheel is a single self-contained package (engine linked statically
# into mufem.pyd; no separate libmufem) and is published as alpha, so it installs
# only with --pre. Cases are launched serially with plain `python` (pymufem is
# only the Linux MPI launcher), so we --exclude-tag long/eternal (those tiers run
# for hours single-threaded here) and `mumps` (direct-solver cases). gmsh is
# still installed for any moderate case that builds its mesh at runtime.
#
# NOTE: the magnetic H(curl)/AMS path heap-corrupts on the alpha Windows wheel
# (0xC0000374 STATUS_HEAP_CORRUPTION at magnetostatic init) — Team1b and Team7
# crash instantly. Nothing is excluded for this: the whole moderate tier is
# gating, so those crashes turn the job (and badge) red until the wheel-side heap
# bug is fixed. A red Windows badge is the intended signal here.
jobs:
  smoke:
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== TEMPORARY DEBUG: only Team1b + Team7 (which fail at mesh load on
      # Windows), with byte-level mesh diagnostics. Team13 (same MFEM v1.3 format,
      # but passes) is inspected for comparison. Revert to the full smoke once the
      # cause is found. =====
      - name: DEBUG - inspect meshes as checked out (raw)
        shell: bash
        run: |
          inspect() {
            local m="$1"
            echo "=== $m ==="
            echo "  worktree bytes : $(wc -c < "$m")"
            echo "  git blob bytes : $(git cat-file -s "HEAD:$m")"
            echo "  attrs          : $(git check-attr text eol -- "$m" | tr '\n' ' ')"
            echo "  first 16 bytes : $(od -An -tx1 -N16 "$m" | tr -s ' ')"
            if gzip -t "$m" 2>/dev/null; then
              echo "  gzip           : VALID"
              echo "  decompressed head:"; gzip -dc "$m" 2>/dev/null | head -c 48 | od -c | sed 's/^/    /'
            else
              echo "  gzip           : CORRUPT -> $(gzip -t "$m" 2>&1 | head -1)"
            fi
          }
          inspect Electromagnetics/Compumag-Team1b-Felix-Cylinder/geometry.mesh
          inspect Electromagnetics/Compumag-Team7-Asymmetrical-Conductor-with-a-Hole/geometry.mesh
          inspect Electromagnetics/Compumag-Team13-3-D-Non-Linear-Magnetostatic-Model/geometry.mesh

      - name: DEBUG - repair meshes from index (autocrlf off), then re-inspect
        shell: bash
        run: |
          git config core.autocrlf false
          git ls-files -z -- '*.mesh' '*.msh' | xargs -0 -r git checkout --force --
          for m in \
            Electromagnetics/Compumag-Team1b-Felix-Cylinder/geometry.mesh \
            Electromagnetics/Compumag-Team7-Asymmetrical-Conductor-with-a-Hole/geometry.mesh ; do
            echo "$m: worktree=$(wc -c < "$m") blob=$(git cat-file -s "HEAD:$m") gzip=$(gzip -t "$m" 2>/dev/null && echo VALID || echo CORRUPT)"
          done

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install mufem (alpha Windows wheel)
        env:
          CI: '1'
          PIP_IS_CI: '1'
        run: |
          pip install --pre --force-reinstall --no-cache-dir mufem
          pip install -r requirements.txt  # matplotlib/numpy/gmsh: no longer mufem deps

      - name: DEBUG - run only Team1b and Team7
        shell: bash
        env:
          MPLBACKEND: Agg  # headless: no GUI backend
        run: |
          python -c "import mufem; print('import OK', getattr(mufem, '__version__', '?'))"
          echo "### Team1b ###"
          ( cd Electromagnetics/Compumag-Team1b-Felix-Cylinder && python case.py ) || echo "Team1b FAILED (exit $?)"
          echo "### Team7 ###"
          ( cd Electromagnetics/Compumag-Team7-Asymmetrical-Conductor-with-a-Hole && python case.py ) || echo "Team7 FAILED (exit $?)"
