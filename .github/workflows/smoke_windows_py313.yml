name: Smoke (Windows x86-64, Python 3.13)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Smoke test on Python 3.13: runs a single representative case (Team1b) to confirm
# the release imports and runs on this Python version. See run_validations_macos_windows.yaml.
jobs:
  smoke:
    uses: ./.github/workflows/run_validations_macos_windows.yaml
    with:
      runner: windows-latest
      python-version: '3.13'
      case-path: 'Electromagnetics/Compumag-Team1b-Felix-Cylinder'
