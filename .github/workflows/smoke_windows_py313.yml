name: Smoke (Windows x86-64, Python 3.13)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Windows smoke test on a GitHub-hosted windows-latest runner (free for this
# public repo). Installs the published Windows wheel from PyPI and runs the
# repo's Team1b validation case — a real solve on actual Windows (stronger than
# the Wine import check in mufem-dev CI).
#
# The Windows wheel is a single self-contained package (engine linked statically
# into mufem.pyd; no separate libmufem) and is published as alpha, so it installs
# only with --pre. Team1b ships a prebuilt mesh (geometry.mesh), so no gmsh is
# needed, and it is launched with plain `python` (serial, single rank): pymufem
# is only the Linux MPI launcher, which a smoke test does not need.
jobs:
  smoke:
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install mufem (alpha Windows wheel)
        run: pip install --pre --force-reinstall --no-cache-dir mufem

      - name: Run the Team1b case (serial; no MPI/pymufem)
        shell: bash
        run: |
          python -c "import mufem; print('import OK', getattr(mufem, '__version__', '?'))"
          cd Electromagnetics/Compumag-Team1b-Felix-Cylinder
          python case.py
