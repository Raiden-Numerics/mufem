name: Smoke (Windows x86-64, Python 3.13)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Windows smoke test on a GitHub-hosted windows-latest runner (free for this
# public repo). Installs the published Windows wheel from PyPI and runs the
# `moderate` validation tier — real solves on actual Windows (stronger than the
# Wine import check in mufem-dev CI).
#
# The Windows wheel is a single self-contained package (engine linked statically
# into mufem.pyd; no separate libmufem) and is published as alpha, so it installs
# only with --pre. Cases are launched serially with plain `python` (pymufem is
# only the Linux MPI launcher), so we --exclude-tag long/eternal (those tiers run
# for hours single-threaded here) and `mumps` (direct-solver cases). gmsh is
# still installed for any moderate case that builds its mesh at runtime.
jobs:
  smoke:
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install mufem (alpha Windows wheel)
        env:
          CI: '1'
          PIP_IS_CI: '1'
        run: |
          pip install --pre --force-reinstall --no-cache-dir mufem
          pip install -r requirements.txt  # matplotlib/numpy/gmsh: no longer mufem deps

      # ===== TEMPORARY DEBUG: every mesh loads when mufem is imported alone, but
      # case.py imports matplotlib+numpy BEFORE mufem. Hypothesis: numpy's OpenBLAS
      # loaded first clashes with mufem's on Windows (heap corruption), surfacing
      # on the two LARGEST meshes (Team1b 1.65MB, Team7 1.74MB decompressed) as
      # "invalid mesh file", while smaller Team13 (0.94MB) survives. Test import
      # order in FRESH subprocesses to avoid the multi-instance confound. =====
      - name: DEBUG - reproduce with case.py import graph + test fixes
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          M="Electromagnetics/Compumag-Team1b-Felix-Cylinder/geometry.mesh"
          python - "$M" <<'PY'
          import subprocess, sys
          mesh = sys.argv[1]
          load = f"\nmufem.Simulation.New(name='t', mesh_path=r'{mesh}')\nprint('LOADED OK')\n"
          variants = {
            "A minimal (mpl,numpy,mufem)":
              "import matplotlib.pyplot as plt\nimport numpy\nimport mufem",
            "B + tdm submodule (case.py order)":
              "import matplotlib.pyplot as plt\nimport numpy\nimport mufem\n"
              "from mufem.electromagnetics.timedomainmagnetic import TimeDomainMagneticModel",
            "C submodule BEFORE numpy":
              "import mufem\nfrom mufem.electromagnetics.timedomainmagnetic import TimeDomainMagneticModel\n"
              "import matplotlib.pyplot as plt\nimport numpy",
            "D + plots (full case.py imports)":
              "import matplotlib.pyplot as plt\nimport numpy\nimport mufem\n"
              "from mufem.electromagnetics.timedomainmagnetic import TimeDomainMagneticModel\n"
              "import sys; sys.path.insert(0,'.'); import plots",
          }
          for name, imp in variants.items():
              r = subprocess.run([sys.executable, "-c", imp + load], capture_output=True, text=True)
              ok = "OK  " if "LOADED OK" in r.stdout else "FAIL"
              tail = (r.stdout + r.stderr).strip().splitlines()
              msg = next((l for l in tail if "mesh" in l.lower() or "Verification" in l or "Error" in l), tail[-1] if tail else "")
              print(f"  {ok} {name:36} {msg[:66]}")
          PY

          echo "=== actual case.py runs (baseline + env-var fixes) ==="
          run() { ( cd Electromagnetics/Compumag-Team1b-Felix-Cylinder && python case.py >o.txt 2>&1; echo "  exit $?  $(grep -iE 'invalid mesh|Verification|Unknown input|Ohmic|Finishing' o.txt | tail -1)"; ) ; }
          echo "-- baseline";                          run
          echo "-- OPENBLAS_NUM_THREADS=1";  OPENBLAS_NUM_THREADS=1 run
          echo "-- OMP_NUM_THREADS=1";       OMP_NUM_THREADS=1 run
          echo "-- KMP_DUPLICATE_LIB_OK";    KMP_DUPLICATE_LIB_OK=TRUE run
