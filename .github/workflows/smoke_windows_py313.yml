name: Smoke (Windows x86-64, Python 3.13)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Windows smoke test on a GitHub-hosted windows-latest runner (free for this
# public repo). Installs the published Windows wheel from PyPI and runs the
# `moderate` validation tier — real solves on actual Windows (stronger than the
# Wine import check in mufem-dev CI).
#
# The Windows wheel is a single self-contained package (engine linked statically
# into mufem.pyd; no separate libmufem) and is published as alpha, so it installs
# only with --pre. Cases are launched serially with plain `python` (pymufem is
# only the Linux MPI launcher), so we --exclude-tag long/eternal (those tiers run
# for hours single-threaded here) and `mumps` (direct-solver cases). gmsh is
# still installed for any moderate case that builds its mesh at runtime.
#
# NOTE: the magnetic H(curl)/AMS path heap-corrupts on the alpha Windows wheel
# (0xC0000374 STATUS_HEAP_CORRUPTION at magnetostatic init) — Team1b and Team7
# crash instantly. Nothing is excluded for this: the whole moderate tier is
# gating, so those crashes turn the job (and badge) red until the wheel-side heap
# bug is fixed. A red Windows badge is the intended signal here.
jobs:
  smoke:
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Safety net: the gzip-compressed meshes are marked binary in
      # .gitattributes, but if the runner's checkout still LF->CRLF-mangled any
      # (git can misdetect a gzip stream without an early NUL as text), the
      # gzip/MFEM read fails ("dsize != sizeof(double)" / "invalid mesh file").
      # Re-materialise every mesh from the index with conversion off so they are
      # byte-exact regardless of how the checkout handled them.
      - name: Repair CRLF-mangled binary meshes
        shell: bash
        run: |
          git config core.autocrlf false
          git ls-files -z -- '*.mesh' '*.msh' | xargs -0 -r git checkout --force --
          echo "verifying mesh integrity:"
          for m in $(git ls-files -- '*.mesh'); do
            gzip -t "$m" 2>/dev/null && echo "  OK   $m" || echo "  PLAIN/na $m"
          done

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install mufem (alpha Windows wheel)
        env:
          CI: '1'
          PIP_IS_CI: '1'
        run: |
          pip install --pre --force-reinstall --no-cache-dir mufem
          pip install -r requirements.txt  # matplotlib/numpy/gmsh: no longer mufem deps

      - name: Run all validation cases except eternal (serial; no MPI/pymufem)
        shell: bash
        env:
          MPLBACKEND: Agg  # headless: no GUI backend
        run: |
          python -c "import mufem; print('import OK', getattr(mufem, '__version__', '?'))"
          python run_cases.py . --launcher python --exclude-tag long --exclude-tag eternal --exclude-tag mumps
