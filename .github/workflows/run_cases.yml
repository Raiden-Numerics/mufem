name: Examples (Linux x86-64, Python 3.12)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

# Full example suite on Python 3.12. Delegates to the reusable _run_cases workflow.
jobs:
  examples:
    uses: ./.github/workflows/run_cases_workflow.yaml
    with:
      python-version: '3.12'
      case-path: '.'
