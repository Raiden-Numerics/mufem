name: Smoke (Linux x86-64, Professional HIP)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

jobs:
  smoke:
    uses: ./.github/workflows/run_smoke_pro_gpu.yaml
    with:
      profile: hip
      image: rocm/dev-ubuntu-24.04:7.14.1-full
      container-options: "--device=/dev/kfd --device=/dev/dri --group-add=video --cap-add=SYS_PTRACE --security-opt seccomp=unconfined"
      library-path: /opt/rocm/lib
    secrets:
      MUFEM_LICENSE_KEY: ${{ secrets.MUFEM_LICENSE_KEY }}
