name: Smoke (Linux x86-64, Python 3.14)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Smoke test on Python 3.14: runs a single representative case (Team1b) to confirm
# the release imports and runs on this Python version.
jobs:
  smoke:
    uses: ./.github/workflows/run_cases_workflow.yaml
    with:
      python-version: '3.14'
      case-path: 'Electromagnetics/Compumag-Team1b-Felix-Cylinder'
