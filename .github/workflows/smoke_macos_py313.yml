name: Smoke (macOS arm64, Python 3.13)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# macOS smoke test on a GitHub-hosted macos-14 runner (Apple Silicon, free for
# this public repo). Installs the published macOS wheel from PyPI and runs the
# `moderate` validation cases (each < ~100s in the Linux MPI suite) — real solves
# on genuine Apple Silicon (there is no arm64 Mach-O emulator, so this is the only
# place the macOS wheel can actually be exercised).
#
# The macOS wheel is a single self-contained package (engine static in mufem.so;
# third-party dylibs bundled and resolved via @rpath) and is published as alpha,
# so it installs only with --pre. The cases are launched serially with plain
# `python` (pymufem is only the Linux MPI launcher). run_cases.py reads each
# case's MufemTest.tags and skips the `long`/`eternal` tiers; because we do not
# pass --have to declare optional backends, cases that `require` one (e.g. MUMPS)
# are skipped too.
jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          allow-prereleases: true

      - name: Install mufem (alpha macOS wheel)
        env:
          CI: '1'
          PIP_IS_CI: '1'
        run: |
          pip install --pre --force-reinstall --no-cache-dir mufem
          pip install -r requirements.txt

      - name: Run the moderate validation cases (serial; skip long/eternal)
        env:
          MPLBACKEND: Agg  # headless: no macOS GUI backend
        run: |
          python -c "import mufem; print('import OK', getattr(mufem, '__version__', '?'))"
          python run_cases.py . --launcher python --exclude-tag long --exclude-tag eternal
