name: Smoke (Linux x86-64, Python 3.15)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: '0 16 * * *'  # daily 01:00 JST (16:00 UTC)
  workflow_dispatch:

# Smoke test on Python 3.15: runs a single representative case (Team1b) to confirm
# the release imports and runs on this Python version. Runs on a GitHub-hosted
# runner (free for this public repo); the full suite stays on the self-hosted one.
jobs:
  smoke:
    uses: ./.github/workflows/run_validations.yaml
    with:
      python-version: '3.15'
      case-path: 'Validations/Electromagnetics/Compumag-Team1b-Felix-Cylinder'
      runner: ubuntu-24.04
