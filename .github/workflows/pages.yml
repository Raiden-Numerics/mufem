name: Deploy site to GitHub Pages

# Build the Jekyll site (README -> index via index.md) and deploy it to GitHub
# Pages on every push to main. SEO (title/description/canonical/OpenGraph/
# JSON-LD + sitemap.xml) comes from jekyll-seo-tag + jekyll-sitemap, both bundled
# in the github-pages gem that actions/jekyll-build-pages uses.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs; and serialize deploys.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        # Injects the correct url/baseurl for this Pages site into the build.
        uses: actions/configure-pages@v5

      - name: Assemble site source
        # The Jekyll source is docs/, but README.md and its images live at the
        # repo root (authoritative, so they still render on github.com). Copy
        # them into docs/ so index.md's include_relative and the relative image
        # paths resolve. Keep this list in sync with images referenced by README.
        run: |
          set -euo pipefail
          cp README.md docs/README.md
          for img in \
            .marquee.png \
            Electromagnetics/Compumag-Team24-Locked-Rotor/results/Result_Animation.gif \
            Electromagnetics/Stutzman_2012_Dipole_Antenna/results/Scene_Radiation_Pattern.png \
            Electromagnetics/Compumag-Team1b-Felix-Cylinder/results/Scene_Electric_Current_Density.png ; do
            mkdir -p "docs/$(dirname "$img")"
            cp "$img" "docs/$img"
          done

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
