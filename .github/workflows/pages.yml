name: Deploy site to GitHub Pages

# Build the Jekyll site (README -> index via index.md) and deploy it to GitHub
# Pages on every push to main. SEO (title/description/canonical/OpenGraph/
# JSON-LD + sitemap.xml) comes from jekyll-seo-tag + jekyll-sitemap, both bundled
# in the github-pages gem that actions/jekyll-build-pages uses.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source =
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs; and serialize deploys.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        # Injects the correct url/baseurl for this Pages site into the build.
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
