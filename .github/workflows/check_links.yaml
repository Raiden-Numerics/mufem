name: Check Markdown Links

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  link-check:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The README links to its own files with absolute main-branch URLs (it is also rendered by
      # GitHub Pages); check them against the checked-out files, so that a PR that adds or moves
      # files passes before the merge and a broken path is still caught.
      - name: Run Lychee link checker
        uses: lycheeverse/lychee-action@v2.7.0
        with:
          args: >
            --no-progress
            --timeout 30
            --max-retries 3
            --retry-wait-time 2
            --require-https
            --accept '200..=299,403,405'
            --remap 'https://github\.com/Raiden-Numerics/mufem/blob/main/ file://${{ github.workspace }}/'
            --remap 'https://raw\.githubusercontent\.com/Raiden-Numerics/mufem/main/ file://${{ github.workspace }}/'
            './**/*.md'
