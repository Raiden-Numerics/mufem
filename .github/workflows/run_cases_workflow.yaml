name: run-cases (reusable)

# Reusable workflow: runs the example cases under a given Python version and case
# path. Called by the per-version workflows (run_cases.yml, smoke_py3xx.yml) so the
# steps live in a single place.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test against
        required: true
        type: string
      case-path:
        description: Path passed to run_cases.py (a directory or '.' for all cases)
        required: true
        type: string

jobs:
  run-examples:
    runs-on: self-hosted
    container:
      image: ubuntu:24.04
    if: github.event.pull_request.draft == false
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.python-version }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        # libmufem is self-contained (bundles its own libs, needs only glibc +
        # libstdc++ which ship in ubuntu:24.04). libgomp1 is for the gmsh -nox
        # build, which is compiled with OpenMP and links libgomp.so.1.
        apt-get install -y libgomp1

    - name: Set MUFEM version from VERSION file
      run: |
        echo "MUFEM_VERSION=$(cat VERSION)" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true

    - name: Install Python dependencies
      run: |
        pip install --force-reinstall --no-cache-dir --no-deps mufem==$MUFEM_VERSION libmufem==$MUFEM_VERSION
        pip install -r requirements.txt
        pip install -i https://gmsh.info/python-packages-dev-nox --force-reinstall --no-cache-dir gmsh

    - name: Verify native engine install
      run: |
        python3 - <<'EOF'
        import importlib.util as u, sys
        s = u.find_spec("libmufem")
        if s is None or not s.origin:
            sys.exit(f"libmufem is a namespace/partial install (origin={s and s.origin}); the package contents are missing")
        print("libmufem OK:", s.origin)
        import libmufem, mufem
        print("mufem import OK")
        EOF

    - name: Run the examples
      env:
        # Enlarge the dynamic loader's static-TLS surplus. Cases that generate a
        # mesh with gmsh dlopen() libgmsh (initial-exec TLS) inside the MPI process
        # after OpenMPI has consumed the small default surplus, otherwise failing
        # with "cannot allocate memory in static TLS block".
        GLIBC_TUNABLES: glibc.rtld.optional_static_tls=2000000
      run: |
        python3 ./run_cases.py ${{ inputs.case-path }}
