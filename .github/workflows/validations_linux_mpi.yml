name: Validations (Linux x86-64, Python 3.12)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

# Full example suite on Python 3.12. Delegates to the reusable _run_cases workflow.
jobs:
  examples:
    uses: ./.github/workflows/run_validations.yaml
    with:
      python-version: '3.12'
      case-path: '.'
      # Cases whose meshes are not shipped run in validations_linux_rebuild_mesh.yml.
      run-cases-args: '--exclude-tag rebuild_mesh'
