name: run-cases (reusable)

# Reusable workflow: runs the example cases under a given Python version and case
# path. Called by validations_linux{,_e2e}.yml (Professional mufem-mpi, self-hosted) and
# smoke_py3xx.yml (Community mufem, GitHub-hosted) so the steps live in a single place.
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to test against
        required: true
        type: string
      case-path:
        description: Path passed to run_cases.py (a directory or '.' for all cases)
        required: true
        type: string
      package:
        description: Package to install (mufem | mufem-mpi); mufem-mpi needs the secret MUFEM_LICENSE_KEY
        required: false
        type: string
        default: mufem
      run-on-draft:
        description: Whether to run when the PR is a draft (each caller decides)
        required: false
        type: boolean
        default: false
      runner:
        description: Runner label (self-hosted for the full suite; GitHub-hosted ubuntu for smoke tests)
        required: false
        type: string
        default: self-hosted
      run-cases-args:
        description: Extra arguments for run_cases.py (e.g. --exclude-tag long)
        required: false
        type: string
        default: ''
      render-geometry:
        description: Also create the geometry images of the cases (netgen viewer, under Xvfb)
        required: false
        type: boolean
        default: false
      render-scenes:
        description: Also create the scenes of the cases (PyVista, rendered off screen)
        required: false
        type: boolean
        default: false
    secrets:
      MUFEM_LICENSE_KEY:
        required: false

jobs:
  run-examples:
    runs-on: ${{ inputs.runner }}
    container:
      image: ubuntu:24.04
    # Run on push/non-PR events, on non-draft PRs, or when the caller opts in to drafts. Pull
    # requests from forks get no license key, so they skip mufem-mpi.
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.pull_request.draft == false || inputs.run-on-draft) &&
       (inputs.package == 'mufem' || github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.python-version }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        apt-get update
        # The mufem wheel is self-contained (bundles the engine and its libs, needs
        # only glibc + libstdc++ which ship in ubuntu:24.04). libgomp1 is for the gmsh -nox
        # build, which is compiled with OpenMP and links libgomp.so.1.
        apt-get install -y libgomp1
        # The scenes render off screen with VTK through EGL (Mesa).
        if [ "${{ inputs.render-scenes }}" = "true" ]; then apt-get install -y libegl1; fi
        # The netgen viewer (Tk and OpenGL) of the geometry images needs an X server: Xvfb.
        if [ "${{ inputs.render-geometry }}" = "true" ]; then
          apt-get install -y xvfb xauth libgl1 libglu1-mesa libtk8.6 libsm6 libice6 libxext6
        fi

    - name: Set MUFEM version from VERSION file
      run: |
        echo "MUFEM_VERSION=$(cat VERSION)" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: true

    # In a container on a GitHub-hosted runner, setup-python puts the *host* path
    # (/opt/hostedtoolcache/...) on PATH, which does not exist inside the container
    # (there the interpreter is mounted under $pythonLocation, /__t/...), and the
    # pip/console scripts carry that host path in their shebang. Put the real
    # location on PATH and run pip as `python -m pip`; pymufem (#!/bin/bash) is
    # unaffected. Harmless on the self-hosted runner.
    - name: Put the setup-python interpreter on PATH
      run: echo "$pythonLocation/bin" >> "$GITHUB_PATH"

    - name: Install Python dependencies
      env:
        CI: '1'
        PIP_IS_CI: '1'
      run: |
        # One wheel holds the bindings and the engine (no separate libmufem since 0.6.11). The
        # Professional packages come from the mufem package index.
        python -m pip install --force-reinstall --no-cache-dir --no-deps "${{ inputs.package }}==$MUFEM_VERSION" \
          --extra-index-url https://mufem.raiden-numerics.com/packages/
        # Headless gmsh first, so that casekit's gmsh requirement is already satisfied.
        python -m pip install -i https://gmsh.info/python-packages-dev-nox --no-cache-dir gmsh
        if [ "${{ inputs.render-scenes }}" = "true" ]; then
          python -m pip install -e "./casekit[scenes]"
        else
          python -m pip install -e ./casekit
        fi

    - name: Verify install
      run: |
        python - <<'EOF'
        import importlib.util as u, os, sys
        s = u.find_spec("mufem")
        if s is None or not s.origin:
            sys.exit(f"mufem is a namespace/partial install (origin={s and s.origin}); the package contents are missing")
        engine = os.path.join(os.path.dirname(s.origin), "libmufem.so")
        if not os.path.isfile(engine):
            sys.exit(f"engine missing from the mufem package: {engine}")
        import mufem
        print("mufem import OK:", getattr(mufem, "__version__", "?"))
        EOF

    - name: Run the examples
      env:
        # Enlarge the dynamic loader's static-TLS surplus. Cases that generate a
        # mesh with gmsh dlopen() libgmsh (initial-exec TLS) after the small default
        # surplus has been consumed, otherwise failing with "cannot allocate memory
        # in static TLS block".
        GLIBC_TUNABLES: glibc.rtld.optional_static_tls=2000000
        MUFEM_LICENSE_KEY: ${{ secrets.MUFEM_LICENSE_KEY }}
      run: |
        # mufem-mpi: 15 ranks, each pinned to a physical core by pymufem, with one thread each.
        LAUNCHER=pymufem
        if [ "${{ inputs.package }}" = "mufem-mpi" ]; then
          export OMP_NUM_THREADS=1
          LAUNCHER="pymufem 15"
        fi
        ${{ inputs.render-geometry && 'xvfb-run -a -s "-screen 0 2400x1600x24"' || '' }} python ./run_cases.py ${{ inputs.case-path }} --launcher "$LAUNCHER" ${{ inputs.run-cases-args }} ${{ inputs.render-geometry && '--render-geometry' || '' }} ${{ inputs.render-scenes && '--render-scenes' || '--no-field-export' }}
