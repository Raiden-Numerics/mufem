<!-- "View on GitHub" button (Pages-only chrome; never rendered on github.com). -->
<style>
  .gh-view {
    position: fixed; top: 12px; right: 12px; z-index: 1000;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; background: #24292f; color: #fff; border-radius: 6px;
    font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-decoration: none; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .gh-view:hover { background: #1b1f24; text-decoration: none; }
  .gh-view svg { fill: #fff; }
  @media (max-width: 600px) { .gh-view .gh-txt { display: none; } }
</style>
