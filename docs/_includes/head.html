<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <!-- mufem additions (minima 2.5.1 has no custom-head hook, so head.html is overridden). -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/favicon-180.png' | relative_url }}">

  <style>
    /* "View on GitHub" pill, last item of the header nav. */
    .site-nav .gh-view {
      display: inline-flex; align-items: center; gap: 6px; vertical-align: middle;
      padding: 4px 12px; line-height: 1.5; color: var(--muted);
      border: 1px solid var(--border); border-radius: 6px; background: var(--subtle);
      font-size: 14px; font-weight: 500; transition: background .15s, border-color .15s;
    }
    .site-nav .gh-view:hover { background: #eef1f4; border-color: #c4ccd5; color: var(--fg); text-decoration: none; }
    .site-nav .gh-view svg { fill: currentColor; }
    @media (max-width: 600px) { .site-nav .gh-view { display: flex; justify-content: flex-end; border: 0; background: none; } }

    :root {
      --fg: #1f2328; --muted: #59636e; --border: #d1d9e0;
      --subtle: #f6f8fa; --accent: #0969da;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    body { color: var(--fg); background: #fff; line-height: 1.6; }

    /* Wider content column (minima's default ~800px reads too narrow). */
    .wrapper { max-width: 1012px; padding-left: 24px; padding-right: 24px; }
    .page-content { padding: 40px 0 56px; }
    .page-content a, .page-content a:visited { color: var(--accent); }
    .page-content a:hover { color: var(--accent); text-decoration: underline; }

    /* Headings: GitHub-like weight and rhythm; offset anchors below the sticky header. */
    .page-content h1, .page-content h2, .page-content h3,
    .page-content h4, .page-content h5, .page-content h6 {
      font-weight: 600; line-height: 1.25; scroll-margin-top: 72px;
    }
    .page-content h1 { font-size: 2.25rem; letter-spacing: -0.02em; margin-bottom: 16px; }
    .page-content h2 {
      font-size: 1.6rem; margin: 48px 0 16px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .page-content h3 { font-size: 1.25rem; margin: 32px 0 12px; }
    .page-content li { margin-bottom: 4px; }
    .page-content li > ul { margin-top: 4px; }

    /* Code: soft background, no border, monospace stack. */
    .page-content code {
      font-family: var(--mono); font-size: 85%; padding: .2em .4em;
      background: rgba(129, 139, 152, .12); border: 0; border-radius: 6px;
    }
    .page-content pre, .page-content .highlight, .page-content .highlight pre {
      background: var(--subtle); border: 0; border-radius: 8px;
    }
    .page-content pre { padding: 16px; font-size: 13.6px; line-height: 1.45; }
    .page-content pre code { padding: 0; background: transparent; font-size: inherit; }

    /* Borderless content tables (the "Why mufem" feature grid and the gallery). */
    .page-content table { border: 0; box-shadow: none; margin-bottom: 24px; }
    .page-content table td, .page-content table th {
      border: 0; padding: 14px 16px; vertical-align: top;
    }
    .page-content table tr:nth-child(even) { background-color: transparent; }
    .page-content table img[width="100%"] {
      border-radius: 8px; box-shadow: 0 1px 3px rgba(31, 35, 40, .12);
      transition: box-shadow .15s;
    }
    .page-content table a:hover img[width="100%"] { box-shadow: 0 4px 14px rgba(31, 35, 40, .18); }

    /* CI badges: a little breathing room between wrapped rows. */
    .page-content img[src*="img.shields.io"] { margin: 2px 0; }

    /* Keep the site header visible while scrolling. */
    .site-header {
      position: sticky; top: 0; z-index: 100; border-top: 0;
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .site-title, .site-title:visited { font-weight: 600; color: var(--fg); }
    .site-nav .page-link { color: var(--muted); }
    .site-nav .page-link:hover { color: var(--fg); text-decoration: none; }

    .site-footer { border-top: 1px solid var(--border); }
  </style>
</head>
