[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mufem-casekit"
version = "0.0.0"
description = "Shared helpers for the mufem validation cases"
requires-python = ">=3.10"
# matplotlib/numpy for the plots; gmsh and netgen-mesher to build the case meshes.
# netgen-mesher ships no cp315 wheel (and no sdist) yet; it is imported lazily, only
# when a mesh is rebuilt, so cases with a committed mesh still run without it.
dependencies = ["matplotlib", "numpy", "gmsh", "netgen-mesher; python_version < '3.15'"]

[project.optional-dependencies]
# PyVista scenes (casekit.pyvista_scene; pillow measures the texts)
scenes = ["pyvista", "pillow"]

[tool.setuptools]
packages = ["casekit"]
package-dir = {"casekit" = "."}

[tool.setuptools.package-data]
# the font of the scenes
casekit = ["fonts/*"]
